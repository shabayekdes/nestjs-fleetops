# Render Blueprint for the FleetOps API. The database is external (Neon), and
# the web app is deployed to Vercel. Deploys are started only by
# .github/workflows/deploy.yml after CI passes and migrations are applied
# (Phase 9 decision 3), so auto-deploy is off.
services:
  - type: web
    name: fleetops-api
    runtime: docker
    plan: free
    # Fixed at creation. Keep it close to the Neon database region.
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: "off"
    envVars:
      # Neon direct connection string (host without "-pooler").
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Render's load balancer is one hop in front of the container.
      - key: TRUST_PROXY
        value: "1"
