name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fleetops
          POSTGRES_PASSWORD: fleetops
          POSTGRES_DB: fleetops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetops -d fleetops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      # Real env vars override .env.test for ConfigModule and prisma.config.ts.
      DATABASE_URL: postgresql://fleetops:fleetops@localhost:5432/fleetops_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Create .env.test from the example
        run: cp .env.test.example .env.test
      - run: npm run lint
      - run: npm test
      - run: npm run db:test:migrate
      - run: npm run test:e2e
      - run: npm run build
      - name: Check committed OpenAPI document is up to date
        run: node dist/scripts/export-openapi.js && git diff --exit-code -- openapi.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Check generated API types are up to date
        run: npm run api:types && git diff --exit-code -- src/lib/api/generated
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build migrate target
        run: docker build --target migrate -t fleetops-migrate:ci apps/api
      - name: Compose smoke test
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
